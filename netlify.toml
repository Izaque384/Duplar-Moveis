[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/cliente/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Content-Security-Policy = "frame-ancestors 'none'"

[[headers]]
  for = "/equipe.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Content-Security-Policy = "frame-ancestors 'none'"


# Endereço público e estável do login da equipe Duplar.
[[redirects]]
  from = "/admin"
  to = "/equipe.html"
  status = 200

[[redirects]]
  from = "/admin/"
  to = "/equipe.html"
  status = 200

[[headers]]
  for = "/admin"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Content-Security-Policy = "frame-ancestors 'none'"

[[headers]]
  for = "/admin/"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Content-Security-Policy = "frame-ancestors 'none'"
