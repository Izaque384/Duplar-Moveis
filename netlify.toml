[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/cliente/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/equipe.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
