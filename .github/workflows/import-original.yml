name: Import original Duplar files (checksum verified)

on:
  push:
    paths:
      - '.github/workflows/import-original.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download original site files from existing Duplar deployment
        run: |
          python3 - <<'PY'
          import hashlib
          import pathlib
          import sys
          import urllib.request
          manifest = """
          7b6c8020db8abf83cacb8b9a1929e16798bbb8aa78c37e671c3d47c05cb8ddbd  assets/img/cozinha-bancada-full.jpg
          4ed92500bd4038f323a54495569e8689c56e4f4aa258b6357fa9cb642e607fed  assets/img/cozinha-bancada-full.webp
          9546b3c983062998cc63eda317163b8bd17b2d3999ff479b88462ced7ce2b8e3  assets/img/cozinha-bancada.jpg
          5e23ea0d36317c2c93135eb77e277cc76f3b3aeb9983546a1321eacd6d34304a  assets/img/cozinha-bancada.webp
          b9f9b32dd2d94b4c59c8ce0c2b0e6e6e699fd573c9b934786a6b277b1eb9e10d  assets/img/cozinha-gourmet-full.jpg
          ba87ffffec4bae77b968be81355541e361fbddebf5a1286daae0d9b02f47acdc  assets/img/cozinha-gourmet-full.webp
          42f577418acfdfcb639a919169b4725e45413bcb4cc9b092c3d7a1ad646a9311  assets/img/cozinha-gourmet.jpg
          afe36bcb90c00c5b73369ed805d9ffff2aed0d5bfa237d1a63f7d8f0220e05b5  assets/img/cozinha-gourmet.webp
          1d236c6f67ef6d9c31540e7597edbd0ebca3fb4328570c3b23983f67eccef13f  assets/img/cozinha-planejada-full.jpg
          f3f77592c36a4bda5c4f1e602c4d93f9147c8677430e23cde0056bb1ccdff553  assets/img/cozinha-planejada-full.webp
          31a3911a002d0175c2cd337349f5b9ab9a2903d577212e91281bf039150a727d  assets/img/cozinha-planejada.jpg
          623ad1bde441c19dfa401a0de2fb091ae4f6dbfb2f73cb98756780888e2b68d3  assets/img/cozinha-planejada.webp
          ab692fb97252fc4f04fcebb04d15a83a9fc3ed08ee0ccc737d568cb7f43ad14c  assets/img/favicon-32.png
          be4fe5f3d53790b33d13a78fad238da8a265af47c2bc7d0f384400aebb546bd0  assets/img/favicon.png
          b6052f4912e4a1c133f6432c6600952d53e53854263377d5808bd45e4209d517  assets/img/hero.jpg
          d7a3dc90e25b8c27cd1fb778f7b3e3def1d8f71545164e22fbf1d29cdaeee6c1  assets/img/hero.webp
          89d2efaf5a6f825e59e7af476decafaa3494a371a63dfbb48721ec6c13936a4c  assets/img/logo-duplar-escura.png
          26e90a907a65c6491aa139938a696fc98503029b1500b43cb9959061bf10b16c  assets/img/logo-duplar.png
          b720a97c05749f2000c594eec4c4945ed26b30b28e5f95a896dc9a51c3a02b6c  assets/img/logo-marca-escura.png
          0573531b77d95519ee9019cd7e1d6198376f67021bbf908b5690b7eafcdb3a45  assets/img/logo-marca.png
          9b32a45bcc69d4c41e542b7faf45f9af334809017ac4dc8ec82472689442642e  assets/img/projeto-06-full.jpg
          72a7c24b4fa9a866847dfd45a649a804e2d75b8483b15d40061594336d3b5aa2  assets/img/projeto-06-full.webp
          711b27267da975af65458cdb8993556334182dcf238be153d6444189e873d4ed  assets/img/projeto-06.jpg
          0b3916a6bf3571c7f1bcfc6cc1367384649fa1d27226c1da217f73e5a0439a20  assets/img/projeto-06.webp
          e4564cf62fdeab8f5fa0205c9222aba2b00da45253d8a167c4b11ef1f37d60fe  assets/img/sala-integrada-full.jpg
          777a1ee505d85023ed4d1520bf13fd4dcada733a720a5cc78b80bc296f7dde16  assets/img/sala-integrada-full.webp
          63355640a12cc55f38185a53c6b203f8db2d6124cf74ce5664d2335e452bbdf6  assets/img/sala-integrada.jpg
          4909a0ee4ea5edfb94b1db95e28b4a65ff1eae483ba11fa75755350e1fa62403  assets/img/sala-integrada.webp
          c9e13dec518ecf601ae64ef6d319e150dc428d26e97f7fb655521711fda4b529  assets/img/sala-jantar-full.jpg
          074da312d144f4ac09d65dce52980e31a1efab0a0de66b66749ec395244f993a  assets/img/sala-jantar-full.webp
          d35f21dd4de3ead851680704d1cf673378e0cc194ae968cbc205f1c4d72f62c1  assets/img/sala-jantar.jpg
          0ad6231efb51ffdae78f2513e8f8b4bf8ba85b05f758d2e960b2419d3f57088e  assets/img/sala-jantar.webp
          af78ec133f2c090a36a02de4fa9050064580b33d4b9857b358b0e9d67f7c9967  index.html
          baac20d311af80e696879f48b434881aca7884902e33fab62d7d7194e0e14cfa  script.js
          5e7e7d5d1ec6222ed916c6840269b5b5dc302329c19fc8eba1b6e3f37be101fd  styles.css
          """
          root = 'https://duplarmoveis.netlify.app/'
          errors=[]
          accepted=[]
          for line in manifest.strip().splitlines():
              expected, path = line.strip().split('  ', 1)
              try:
                  req = urllib.request.Request(root + path, headers={'User-Agent':'Duplar-GitHub-Import/1.0'})
                  with urllib.request.urlopen(req, timeout=25) as response:
                      data = response.read()
                  got = hashlib.sha256(data).hexdigest()
                  if got != expected:
                      errors.append(f'CHECKSUM MISMATCH: {path}, got {got}')
                      continue
                  target = pathlib.Path(path)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  accepted.append(path)
              except Exception as e:
                  errors.append(f'FAILED: {path}, {str(e)}')
          print(f'Verified exact matches: {len(accepted)}/{len(manifest.strip().splitlines())}', flush=True)
          for error in errors:
              print(error, flush=True)
          if errors:
              sys.exit('Import incomplete. No files committed; use the uploaded ZIP as authoritative source.')
          PY
      - name: Commit matching originals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css script.js assets/img/
          git commit -m "feat: import original static Duplar site and image assets"
          git push
