name: Render Duplar cinematic hero video

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - .github/workflows/hero-video-render.yml

permissions:
  contents: write

concurrency:
  group: duplar-hero-render
  cancel-in-progress: false

jobs:
  render:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install FFmpeg and FFprobe if needed
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -1
      - name: Download original high-resolution footage from Pexels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/duplar-originals review/original assets/video
          curl --fail --location --retry 3 --retry-delay 4 --silent --show-error 'https://videos.pexels.com/video-files/40807466/17436194_3840_2160_30fps.mp4' -o /tmp/duplar-originals/01-cozinha.mp4
          curl --fail --location --retry 3 --retry-delay 4 --silent --show-error 'https://videos.pexels.com/video-files/34955012/14807046_3840_2160_25fps.mp4' -o /tmp/duplar-originals/02-integrado.mp4
          curl --fail --location --retry 3 --retry-delay 4 --silent --show-error 'https://videos.pexels.com/video-files/39024330/16605534_3840_2160_30fps.mp4' -o /tmp/duplar-originals/03-quarto.mp4
          for file in /tmp/duplar-originals/*.mp4; do
            echo "SOURCE: $file"
            ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate,bit_rate,duration -of default=nw=1 "$file"
          done
      - name: Capture original-source review frames
        shell: bash
        run: |
          set -euo pipefail
          for item in 01-cozinha 02-integrado 03-quarto; do
            for sec in 1 3 5; do
              ffmpeg -hide_banner -loglevel error -y -ss "$sec" -i "/tmp/duplar-originals/$item.mp4" -frames:v 1 -vf 'scale=960:-2' -q:v 3 "review/original/$item-$sec.jpg"
            done
          done
      - name: Render each output straight from originals, encoding only once
        shell: bash
        run: |
          set -euo pipefail
          for mode in wide mobile; do
            if [[ "$mode" == wide ]]; then
              w=1920; h=1080; crf=18; maxrate=8500k; bufsize=12000k
              x1=0.50; x2=0.50; x3=0.50
            else
              w=720; h=1280; crf=19; maxrate=4600k; bufsize=7200k
              x1=0.49; x2=0.55; x3=0.60
            fi
            # Sources decoded once and processed before a single FINAL H.264 encoding:
            # 3 scenes x 4.8s, with 0.35s overlaps = approximately 13.7s.
            filter="[0:v]trim=start=2.3:duration=4.8,setpts=PTS-STARTPTS,fps=24,scale=$w:$h:force_original_aspect_ratio=increase,crop=$w:$h:x=(in_w-out_w)*$x1:y=(in_h-out_h)/2,setsar=1,eq=contrast=1.025:saturation=1.0,format=yuv420p,settb=AVTB[a];"
            filter+="[1:v]trim=start=3.6:duration=4.8,setpts=PTS-STARTPTS,fps=24,scale=$w:$h:force_original_aspect_ratio=increase,crop=$w:$h:x=(in_w-out_w)*$x2:y=(in_h-out_h)/2,setsar=1,eq=contrast=1.025:saturation=1.0,format=yuv420p,settb=AVTB[b];"
            filter+="[2:v]trim=start=0.9:duration=4.8,setpts=PTS-STARTPTS,fps=24,scale=$w:$h:force_original_aspect_ratio=increase,crop=$w:$h:x=(in_w-out_w)*$x3:y=(in_h-out_h)/2,setsar=1,eq=contrast=1.025:saturation=1.0,format=yuv420p,settb=AVTB[c];"
            filter+="[a][b]xfade=transition=fade:duration=0.35:offset=4.45[ab];[ab][c]xfade=transition=fade:duration=0.35:offset=8.90[out]"
            ffmpeg -hide_banner -loglevel error -stats -y \
              -i /tmp/duplar-originals/01-cozinha.mp4 \
              -i /tmp/duplar-originals/02-integrado.mp4 \
              -i /tmp/duplar-originals/03-quarto.mp4 \
              -filter_complex "$filter" -map "[out]" -an -sn \
              -c:v libx264 -preset slow -crf "$crf" -maxrate "$maxrate" -bufsize "$bufsize" \
              -pix_fmt yuv420p -profile:v high -level 4.1 \
              -movflags +faststart "assets/video/hero-duplar-$mode-v2.mp4"
          done
          ffmpeg -hide_banner -loglevel error -y -ss 0.6 -i assets/video/hero-duplar-wide-v2.mp4 -frames:v 1 -q:v 3 assets/video/hero-duplar-poster-v2.jpg
          mkdir -p review/finished
          for mode in wide mobile; do
            for sec in 2 6 11; do
              ffmpeg -hide_banner -loglevel error -y -ss "$sec" -i "assets/video/hero-duplar-$mode-v2.mp4" -frames:v 1 -vf 'scale=960:-2' -q:v 3 "review/finished/$mode-$sec.jpg"
            done
          done
      - name: Verify dimensions, duration, audio and file sizes
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          for name, minimum in [('wide',(1920,1080)),('mobile',(720,1280))]:
              p=f'assets/video/hero-duplar-{name}-v2.mp4'
              data=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',p]))
              streams=data['streams']
              v=next(x for x in streams if x['codec_type']=='video')
              assert all(x['codec_type']!='audio' for x in streams),p+' contains audio'
              assert (v['width'],v['height']) == minimum, (p,v['width'],v['height'])
              assert v['codec_name']=='h264',v['codec_name']
              seconds=float(data['format']['duration'])
              size=os.stat(p).st_size
              print('QUALITY V2',p,'duration',seconds,'sizeMB',round(size/1e6,2),'avgMbps',round(size*8/seconds/1e6,2))
              assert 13.2 <= seconds <= 14.2, seconds
              assert size < (18_000_000 if name=='wide' else 10_000_000),size
          assert os.stat('assets/video/hero-duplar-poster-v2.jpg').st_size < 700_000
          PY
      - name: Commit V2 files only to develop
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/video/hero-duplar-wide-v2.mp4 assets/video/hero-duplar-mobile-v2.mp4 assets/video/hero-duplar-poster-v2.jpg
          if git diff --cached --quiet; then
            echo 'No media differences'
          else
            git commit -m 'assets: add higher-quality single-pass cinematic hero v2'
            git push origin HEAD:develop
          fi
      - name: Upload QA frames and final media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duplar-hero-quality-v2
          path: |
            assets/video/hero-duplar-wide-v2.mp4
            assets/video/hero-duplar-mobile-v2.mp4
            assets/video/hero-duplar-poster-v2.jpg
            review/
          if-no-files-found: warn
          retention-days: 14
