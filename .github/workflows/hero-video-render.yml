name: Render Duplar cinematic hero video

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - .github/workflows/hero-video-render.yml

permissions:
  contents: write

concurrency:
  group: duplar-hero-render
  cancel-in-progress: false

jobs:
  render:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install FFmpeg if needed
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1
      - name: Fetch Pexels clips (licensed for commercial use)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/duplar-clips assets/video
          curl --fail --location --retry 3 --retry-delay 4 --silent --show-error 'https://videos.pexels.com/video-files/40807466/17436194_3840_2160_30fps.mp4' -o /tmp/duplar-clips/01.mp4
          curl --fail --location --retry 3 --retry-delay 4 --silent --show-error 'https://videos.pexels.com/video-files/34955012/14807046_3840_2160_25fps.mp4' -o /tmp/duplar-clips/02.mp4
          curl --fail --location --retry 3 --retry-delay 4 --silent --show-error 'https://videos.pexels.com/video-files/3770054/3770054-hd_1920_1080_25fps.mp4' -o /tmp/duplar-clips/03.mp4
          curl --fail --location --retry 3 --retry-delay 4 --silent --show-error 'https://videos.pexels.com/video-files/39024330/16605534_3840_2160_30fps.mp4' -o /tmp/duplar-clips/04.mp4
          for clip in /tmp/duplar-clips/*.mp4; do
            echo "$clip $(du -h "$clip" | cut -f1)"
            ffprobe -v error -select_streams v:0 -show_entries stream=width,height,duration -of default=nw=1 "$clip"
          done
      - name: Assemble silent wide and mobile loops
        shell: bash
        run: |
          set -euo pipefail
          # Individual segments are encoded to identical constant-framerate
          # media before xfade. This avoids mixed-source timebase issues.
          starts=(3.0 4.0 1.5 1.5)
          for mode in wide mobile; do
            if [[ "$mode" == wide ]]; then
              width=1600; height=900; bitrate=1600k; crf=27
            else
              width=540; height=960; bitrate=900k; crf=28
            fi
            for idx in 1 2 3 4; do
              k=$(printf '%02d' "$idx")
              start=${starts[$((idx-1))]}
              ffmpeg -hide_banner -loglevel error -y \
                -ss "$start" -i "/tmp/duplar-clips/$k.mp4" \
                -t 3.75 -an -sn \
                -vf "scale=$width:$height:force_original_aspect_ratio=increase,crop=$width:$height,eq=contrast=1.06:saturation=0.88:brightness=-0.012" \
                -r 24 -pix_fmt yuv420p \
                -c:v libx264 -preset veryfast -crf "$crf" -maxrate "$bitrate" -bufsize 2400k \
                "/tmp/duplar-clips/$mode-$k.mp4"
            done
            ffmpeg -hide_banner -loglevel error -y \
              -i "/tmp/duplar-clips/$mode-01.mp4" \
              -i "/tmp/duplar-clips/$mode-02.mp4" \
              -i "/tmp/duplar-clips/$mode-03.mp4" \
              -i "/tmp/duplar-clips/$mode-04.mp4" \
              -filter_complex "[0:v][1:v]xfade=transition=fade:duration=0.35:offset=3.4[x1];[x1][2:v]xfade=transition=fade:duration=0.35:offset=6.8[x2];[x2][3:v]xfade=transition=fade:duration=0.35:offset=10.2[out]" \
              -map "[out]" -an -r 24 -pix_fmt yuv420p \
              -c:v libx264 -preset medium -crf "$crf" -maxrate "$bitrate" -bufsize 2400k \
              -movflags +faststart "assets/video/hero-duplar-$mode.mp4"
          done
          ffmpeg -hide_banner -loglevel error -y -ss 0.4 -i assets/video/hero-duplar-wide.mp4 \
            -frames:v 1 -q:v 3 assets/video/hero-duplar-poster.jpg
          for file in assets/video/*; do
            echo "Produced: $file $(du -h "$file" | cut -f1)"
          done
      - name: Validate media, duration and file weight
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          for name in ['wide', 'mobile']:
              p=f'assets/video/hero-duplar-{name}.mp4'
              obj=json.loads(subprocess.check_output([
                  'ffprobe','-v','error','-show_entries','format=duration,size',
                  '-of','json',p]))
              secs=float(obj['format']['duration'])
              size=int(obj['format']['size'])
              print(p, secs, size)
              assert 13.5 <= secs <= 14.3
              assert size < 10_000_000, f'Excessive size: {size}'
          assert os.path.getsize('assets/video/hero-duplar-poster.jpg') < 500_000
          PY
      - name: Commit media to develop (no production release)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/video/hero-duplar-wide.mp4 assets/video/hero-duplar-mobile.mp4 assets/video/hero-duplar-poster.jpg
          if git diff --cached --quiet; then
            echo 'No media differences'
          else
            git commit -m 'assets: add optimized cinematic hero footage to develop'
            git push origin HEAD:develop
          fi
      - name: Upload video artifacts for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duplar-cinematic-video
          path: assets/video/
          if-no-files-found: warn
          retention-days: 14
