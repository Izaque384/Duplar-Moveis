name: Visual review of Duplar landing

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/visual-review.yml
      - index.html
      - styles.css
      - theme-monochrome.css
      - script.js
      - assets/img/**
      - assets/video/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install browser automation
        run: |
          npm install --no-save --silent playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render and test responsive pages
        run: |
          python3 -m http.server 4173 > /tmp/duplar-site.log 2>&1 &
          mkdir -p review
          node <<'NODE'
          const {chromium} = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const cases=[
              {name:'desktop',width:1440,height:900},
              {name:'laptop',width:1366,height:768},
              {name:'tablet',width:900,height:900},
              {name:'mobile',width:390,height:844},
              {name:'mobile-small',width:360,height:780},
              {name:'mobile-compact',width:375,height:667},
              {name:'mobile-tiny',width:320,height:568},
              {name:'mobile-landscape',width:844,height:390}
            ];
            for(const cfg of cases){
              const page=await browser.newPage({viewport:{width:cfg.width,height:cfg.height},deviceScaleFactor:1});
              await page.emulateMedia({reducedMotion:'reduce'});
              const errors=[];
              page.on('pageerror',error=>errors.push(error.message));
              await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
              await page.locator('img[loading="lazy"]').evaluateAll(imgs=>imgs.forEach(img=>img.loading='eager'));
              const imageStates = await page.evaluate(async()=>{
                const images=[...document.querySelectorAll('.ambiente-card img, .hero-media img, .sobre-foto img, .dif-slide img')];
                await Promise.all(images.map(img=>img.decode().catch(()=>{})));
                return images.map(img=>({src:img.getAttribute('src'),width:img.naturalWidth,complete:img.complete}));
              });
              const broken=imageStates.filter(img=>!img.width||!img.complete);
              if(broken.length)throw Error(cfg.name+' broken or undecoded gallery images: '+JSON.stringify(broken));
              await page.waitForTimeout(200);
              const dims=await page.evaluate(()=>({scroll:document.documentElement.scrollWidth,inner:innerWidth}));
              if(dims.scroll>dims.inner+2)throw Error(cfg.name+' horizontal overflow '+JSON.stringify(dims));
              const viewportCheck=await page.evaluate(()=>{
                const hero=document.querySelector('.hero').getBoundingClientRect();
                const media=document.querySelector('.hero-media').getBoundingClientRect();
                const content=document.querySelector('.hero-content').getBoundingClientRect();
                const header=document.querySelector('.site-header').getBoundingClientRect();
                const next=document.querySelector('#ambientes').getBoundingClientRect();
                const mediaVideo=document.querySelector('.hero-video').getBoundingClientRect();
                const buttons=[...document.querySelectorAll('.hero .hero-actions .btn')].map(x=>x.getBoundingClientRect().bottom);
                return {
                  viewport:innerHeight,heroTop:hero.top,heroBottom:hero.bottom,heroHeight:hero.height,
                  mediaHeight:media.height,videoHeight:mediaVideo.height,nextTop:next.top,
                  contentTop:content.top,contentBottom:content.bottom,headerBottom:header.bottom,
                  buttonBottom:Math.max(...buttons)
                };
              });
              if(Math.abs(viewportCheck.heroHeight-viewportCheck.viewport)>2
                || Math.abs(viewportCheck.nextTop-viewportCheck.viewport)>2
                || Math.abs(viewportCheck.mediaHeight-viewportCheck.viewport)>2
                || viewportCheck.contentBottom>viewportCheck.viewport+1
                || viewportCheck.buttonBottom>viewportCheck.viewport+1
                || viewportCheck.contentTop<viewportCheck.headerBottom-3)
                throw Error(cfg.name+' hero must fit one full screen with visible content: '+JSON.stringify(viewportCheck));
              console.log('PASS single-screen hero '+cfg.name+' '+JSON.stringify(viewportCheck));
              const theme = await page.evaluate(()=>({
                cssLoaded:[...document.styleSheets].some(s=>(s.href||'').includes('theme-monochrome.css')),
                surface:getComputedStyle(document.querySelector('.ambientes')).backgroundColor,
                text:getComputedStyle(document.querySelector('.ambientes')).color
              }));
              if(!theme.cssLoaded || theme.surface!=='rgb(16, 17, 19)')
                throw Error(cfg.name+' new theme missing: '+JSON.stringify(theme));
              if(errors.length)throw Error(cfg.name+' runtime errors: '+errors.join('; '));
              const testimonial=await page.evaluate(()=>{
                const section=document.querySelector('#depoimentos');
                const intro=section?.querySelector('.depoimento-intro');
                const card=section?.querySelector('.depoimento-card');
                const title=section?.querySelector('#depoimento-titulo');
                const quote=section?.querySelector('.depoimento-citacao');
                if(!section||!intro||!card||!quote||!title)return {missing:true};
                const a=intro.getBoundingClientRect(),b=card.getBoundingClientRect();
                return {
                  missing:false,
                  count:document.querySelectorAll('.depoimento-citacao').length,
                  author:card.textContent.includes('@fernando_prado31'),
                  quoteComplete:quote.textContent.includes('Super recomendo!'),
                  position: b.left>=a.right-2?'right':b.top>=a.bottom-2?'below':'overlap',
                  sectionOverflow:section.scrollWidth>section.clientWidth+2
                };
              });
              if(testimonial.missing||testimonial.count!==1||!testimonial.author
                ||!testimonial.quoteComplete||testimonial.sectionOverflow
                ||testimonial.position!==(cfg.width>760?'right':'below'))
                throw Error(cfg.name+' testimonial layout issue: '+JSON.stringify(testimonial));
              console.log('PASS testimonial '+cfg.name+' '+JSON.stringify(testimonial));
              const contact=await page.evaluate(()=>{
                const section=document.querySelector('#contato');
                const intro=section?.querySelector('.atendimento-apresentacao');
                const card=section?.querySelector('.atendimento-painel');
                const button=section?.querySelector('#whatsBtn');
                if(!section||!intro||!card||!button)return {missing:true};
                const a=intro.getBoundingClientRect(),b=card.getBoundingClientRect();
                return {
                  missing:false,
                  number:section.textContent.includes('04 / ATENDIMENTO'),
                  processRemoved:!document.querySelector('#processo'),
                  whatsappActive:button.getAttribute('aria-disabled')!== 'true' && button.href.startsWith('https://wa.me/558881734015?text='),
                  buttonText:button.textContent.trim(),
                  position:b.left>=a.right-2?'right':b.top>=a.bottom-2?'below':'overlap',
                  overflow:section.scrollWidth>section.clientWidth+2,
                  height:section.getBoundingClientRect().height
                };
              });
              if(contact.missing||!contact.number||!contact.processRemoved
                ||!contact.whatsappActive||contact.overflow
                ||contact.position!==(cfg.width>940?'right':'below'))
                throw Error(cfg.name+' contact section issue: '+JSON.stringify(contact));
              console.log('PASS contact '+cfg.name+' '+JSON.stringify(contact));
              const contacts=await page.evaluate(()=>({
                instagram:[...document.querySelectorAll('.site-footer a')].some(a=>a.href==='https://www.instagram.com/duplar_moveis/'),
                whatsapp:[...document.querySelectorAll('.site-footer a')].some(a=>a.href==='https://wa.me/558881734015'),
                allCtas:[...document.querySelectorAll('[data-contact-cta]')].every(a=>a.href.startsWith('https://wa.me/558881734015?text='))
              }));
              if(!contacts.instagram||!contacts.whatsapp||!contacts.allCtas)
                throw Error(cfg.name+' official contact links issue: '+JSON.stringify(contacts));
              const carousel = page.locator('#difCarousel');
              const initialCarousel=await page.evaluate(()=>{
                const el=document.querySelector('#difCarousel');
                const slides=[...el.querySelectorAll('.dif-slide')];
                const first=slides[0].getBoundingClientRect();
                const picture=slides[0].querySelector('.dif-slide-visual').getBoundingClientRect();
                const copy=slides[0].querySelector('.dif-slide-copy').getBoundingClientRect();
                return {
                  slideCount:slides.length,
                  visible:slides.filter(s=>!s.hidden).length,
                  firstVisible:!slides[0].hidden,
                  running:el.classList.contains('is-playing'),
                  imageLeft:picture.left, imageTop:picture.top,
                  copyLeft:copy.left,copyTop:copy.top,
                  overflow:el.scrollWidth>el.clientWidth+2
                };
              });
              if(initialCarousel.slideCount!==4||initialCarousel.visible!==1
                 ||!initialCarousel.firstVisible||initialCarousel.running
                 ||initialCarousel.overflow
                 ||!(cfg.width>860
                    ? initialCarousel.copyLeft>=initialCarousel.imageLeft+30
                    : initialCarousel.copyTop>=initialCarousel.imageTop+50))
                throw Error(cfg.name+' initial editorial carousel issue: '+JSON.stringify(initialCarousel));
              await carousel.scrollIntoViewIfNeeded();
              await page.locator('#difNext').click();
              if(!await page.locator('.dif-slide[data-dif-index="1"]').isVisible()
                 ||await page.locator('#difCarousel.is-playing').count()!==0
                 ||await page.locator('[data-dif-go="1"]').getAttribute('aria-pressed')!=='true')
                 throw Error(cfg.name+' manual next or pause failed');
              await page.locator('[data-dif-go="3"]').click();
              if(!await page.locator('.dif-slide[data-dif-index="3"]').isVisible())
                 throw Error(cfg.name+' indicator selection failed');
              await page.locator('#difPrevious').click();
              if(!await page.locator('.dif-slide[data-dif-index="2"]').isVisible())
                 throw Error(cfg.name+' previous navigation failed');
              await page.locator('[data-dif-go="0"]').click();
              await carousel.screenshot({path:'review/diferenciais-'+cfg.name+'.png',animations:'disabled'});
              console.log('PASS carousel '+cfg.name+' '+JSON.stringify(initialCarousel));
              await page.screenshot({path:'review/'+cfg.name+'.png',fullPage:true,animations:'disabled'});
              await page.locator('#contato').screenshot({path:'review/atendimento-'+cfg.name+'.png',animations:'disabled'});
              await page.locator('#depoimentos').screenshot({path:'review/depoimento-'+cfg.name+'.png',animations:'disabled'});
              if(cfg.name==='mobile'){
                const toggle=page.locator('#navToggle');
                await toggle.click();
                if(await toggle.getAttribute('aria-expanded')!=='true')throw Error('mobile menu did not open');
                await page.keyboard.press('Escape');
                if(await toggle.getAttribute('aria-expanded')!=='false')throw Error('mobile menu did not close');
                await page.locator('.ambiente-card').first().click();
                if(!(await page.locator('#lightbox').isVisible()))throw Error('lightbox did not open');
                await page.keyboard.press('Escape');
                await page.waitForTimeout(350);
                if(await page.locator('#lightbox').isVisible())throw Error('lightbox did not close');
              }
              console.log('PASS '+cfg.name+' '+JSON.stringify(dims));
              await page.close();
            }
            // Real motion checks complement the reduced-motion image fallback screenshots.
            for (const cfg of [
              {name:'desktop',width:1440,height:900,file:'hero-duplar-wide-v2.mp4'},
              {name:'mobile',width:390,height:844,file:'hero-duplar-mobile-v2.mp4'}
            ]) {
              const page=await browser.newPage({viewport:{width:cfg.width,height:cfg.height},deviceScaleFactor:1});
              await page.emulateMedia({reducedMotion:'no-preference'});
              await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
              await page.waitForTimeout(2200);
              const initial=await page.locator('#heroVideo').evaluate(v=>({
                src:v.currentSrc, configuredSrc:v.src, paused:v.paused, muted:v.muted,
                ready:v.readyState, network:v.networkState, error:v.error?.code || null,
                codec:v.canPlayType('video/mp4; codecs="avc1.42E01E"'),
                className:document.querySelector('.hero-media')?.className
              }));
              console.log('Video diagnostic '+cfg.name+' '+JSON.stringify(initial));
              if(!initial.codec) {
                if(initial.className.includes('is-video-ready'))
                  throw Error('Unsupported codec may not mark video ready');
                console.log('SKIP autoplay in browser without H264 decoder, fallback preserved');
                await page.close();
                continue;
              }
              await page.waitForFunction(() => {
                const v=document.getElementById('heroVideo');
                return !!v && v.readyState >= 2 && document.querySelector('.hero-media')?.classList.contains('is-video-ready');
              },null,{timeout:13000});
              const info=await page.locator('#heroVideo').evaluate(v=>({
                src:v.currentSrc, paused:v.paused, muted:v.muted,
                size:[v.videoWidth,v.videoHeight], duration:v.duration
              }));
              if(!info.src.includes(cfg.file)||info.paused||!info.muted)
                throw Error(cfg.name+' video mismatch: '+JSON.stringify(info));
              if(info.duration<13 || info.duration>15) throw Error(cfg.name+' unexpected duration '+info.duration);
              await page.screenshot({path:'review/hero-video-'+cfg.name+'.png',animations:'disabled'});
              console.log('PASS '+cfg.name+' autoplay '+JSON.stringify(info));
              await page.close();
            }
            // Autoplay must advance only when visible and user has not requested reduced motion.
            const autoplay = await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:1});
            await autoplay.emulateMedia({reducedMotion:'no-preference'});
            await autoplay.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
            await autoplay.locator('#difCarousel').scrollIntoViewIfNeeded();
            await autoplay.waitForFunction(() => document.querySelector('#difCarousel')?.classList.contains('is-playing'), null, {timeout:3000});
            await autoplay.waitForFunction(() => !document.querySelector('.dif-slide[data-dif-index="1"]')?.hidden, null, {timeout:10000});
            await autoplay.locator('#difCarousel').hover();
            if(await autoplay.locator('#difCarousel.is-playing').count()!==0)
              throw Error('Autoplay did not pause while hovering');
            await autoplay.locator('#difNext').click();
            if(await autoplay.locator('#difRotationToggle').getAttribute('aria-pressed')!=='true')
              throw Error('Manual navigation did not stop autoplay');
            console.log('PASS desktop autoplay, hover pause and manual override');
            await autoplay.close();
            const touch = await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true});
            await touch.emulateMedia({reducedMotion:'no-preference'});
            await touch.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
            await touch.locator('#difCarousel').scrollIntoViewIfNeeded();
            if(await touch.locator('#difCarousel.is-playing').count()!==0)
              throw Error('Mobile carousel unexpectedly autoplaying');
            console.log('PASS mobile manual-only');
            await touch.close();
            await browser.close();
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE
      - name: Bundle browser previews and site source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duplar-visual-review
          path: |
            review/
            index.html
            styles.css
            theme-monochrome.css
            script.js
            assets/img/
            assets/video/
          retention-days: 14
