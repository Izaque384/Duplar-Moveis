name: Publish Duplar cinematic details media

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/diferenciais-video-publish.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: duplar-details-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          persist-credentials: true
      - name: Retrieve verified media from successful rendering artifacts
        uses: actions/download-artifact@v4
        with:
          name: duplar-details-film-qa
          run-id: 44910751937
          github-token: ${{ github.token }}
          path: .
      - name: Verify rendered media and publish only the three needed files
        shell: bash
        run: |
          set -euo pipefail
          ls -lh assets/video/duplar-detalhes-*.mp4 assets/video/duplar-detalhes-poster.jpg
          python3 - <<'PY'
          import os,subprocess,json
          for mode,dimensions in [('wide',(1920,1080)),('mobile',(720,1280))]:
              p=f'assets/video/duplar-detalhes-{mode}.mp4'
              d=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',p]))
              v=next(s for s in d['streams'] if s['codec_type']=='video')
              assert (v['width'],v['height'])==dimensions
              assert v['codec_name']=='h264'
              assert all(s['codec_type']!='audio' for s in d['streams'])
              assert 20.2<=float(d['format']['duration'])<=20.8
              print('VERIFIED',p,round(os.path.getsize(p)/1e6,2),'MB')
          assert os.path.exists('assets/video/duplar-detalhes-poster.jpg')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/video/duplar-detalhes-wide.mp4 assets/video/duplar-detalhes-mobile.mp4 assets/video/duplar-detalhes-poster.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'assets: publish cinematic Duplar details film in two aspect ratios'
            git fetch origin develop
            git rebase origin/develop
            git push origin HEAD:develop
          else
            echo 'Media already committed'
          fi
